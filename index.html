<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天平比重小遊戲</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "MicroSoft YaHei", "PingFang TC", sans-serif;
    }
    body {
      background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
    }
    h1 {
      color: #0277bd;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }
    .game-container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
    }

    /* 物品選擇區 */
    .item-section {
      background: #f1f8e9;
      border: 2px dashed #7cb342;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 25px;
    }
    .item-section h3 {
      margin: 0 0 10px 0;
      color: #33691e;
      font-size: 1.1rem;
    }
    .item-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .item-card {
      background: white;
      border: 2px solid #aed581;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }
    .item-icon {
      font-size: 2.2rem;
    }
    .item-name {
      font-weight: bold;
      color: #333;
      margin: 4px 0;
    }
    .btn-group {
      display: flex;
      gap: 5px;
      margin-top: 5px;
    }
    .btn-add {
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: transform 0.1s;
    }
    .btn-add:active { transform: scale(0.95); }
    .btn-left { background-color: #42a5f5; }
    .btn-right { background-color: #ff7043; }

    /* 天平視覺區 */
    .scale-stage {
      position: relative;
      height: 280px;
      margin: 20px 0 10px 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .fulcrum {
      width: 0;
      height: 0;
      border-left: 25px solid transparent;
      border-right: 25px solid transparent;
      border-bottom: 60px solid #78909c;
      position: relative;
      z-index: 2;
    }
    .base-line {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 12px;
      background: #546e7a;
      border-radius: 6px;
    }
    .scale-beam-container {
      position: absolute;
      bottom: 58px;
      width: 520px;
      height: 200px;
      display: flex;
      justify-content: center;
      transform-origin: 50% 100%;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 3;
    }
    .beam {
      width: 520px;
      height: 12px;
      background: #37474f;
      border-radius: 6px;
      position: absolute;
      bottom: 0;
    }
    .pan-assembly {
      position: absolute;
      bottom: 0;
      width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .pan-assembly.left { left: 0; }
    .pan-assembly.right { right: 0; }
    .string {
      width: 2px;
      height: 80px;
      background: #78909c;
    }
    .strings-v {
      display: flex;
      justify-content: space-between;
      width: 140px;
    }
    .pan {
      width: 160px;
      min-height: 50px;
      border-bottom: 8px solid #ffa726;
      border-left: 4px solid #ffa726;
      border-right: 4px solid #ffa726;
      border-radius: 0 0 30px 30px;
      background: rgba(255, 224, 178, 0.4);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      padding: 6px;
      gap: 4px;
    }
    .pan-item {
      font-size: 1.6rem;
      cursor: pointer;
      animation: popIn 0.2s ease-out;
      transition: transform 0.1s;
    }
    .pan-item:hover { transform: scale(1.2); }
    @keyframes popIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* 控制面板與托盤資訊 */
    .pans-control {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .pan-card {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }
    .pan-card.left { background: #e3f2fd; border: 2px solid #90caf9; }
    .pan-card.right { background: #fbe9e7; border: 2px solid #ffab91; }
    .pan-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 6px; }
    .pan-card.left .pan-title { color: #1565c0; }
    .pan-card.right .pan-title { color: #d84315; }
    .btn-clear {
      background: #ef5350;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 6px;
    }

    /* 問題區雙欄佈局 */
    .question-section {
      background: #f5f5f5;
      border-radius: 15px;
      padding: 18px;
      margin-top: 10px;
    }
    .q-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .q-group {
      flex: 1;
      min-width: 280px;
      border-radius: 12px;
      padding: 12px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .q-group.left-group { border-top: 5px solid #1e88e5; }
    .q-group.right-group { border-top: 5px solid #f4511e; }

    .q-group-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }
    .left-group .q-group-title { color: #1565c0; }
    .right-group .q-group-title { color: #d84315; }

    .q-block {
      margin-bottom: 15px;
    }
    .q-title {
      font-weight: bold;
      color: #37474f;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .options {
      display: flex;
      gap: 8px;
    }
    .option-btn {
      flex: 1;
      padding: 8px 4px;
      border: 2px solid #cfd8dc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-weight: bold;
      color: #455a64;
      text-align: center;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .option-btn.selected {
      border-color: #0288d1;
      background: #e1f5fe;
      color: #0277bd;
      box-shadow: 0 0 6px rgba(2, 136, 209, 0.3);
    }

    /* 操作按鈕 */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    .btn-main {
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }
    .btn-main:active { transform: scale(0.96); }
    .btn-check { background: #66bb6a; color: white; }
    .btn-reset { background: #ffa726; color: white; }
    .btn-main:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 反饋訊息 */
    .feedback {
      text-align: center;
      font-size: 1.25rem;
      font-weight: bold;
      margin-top: 15px;
      height: 32px;
    }
    .feedback.correct { color: #2e7d32; }
    .feedback.wrong { color: #c62828; }

    /* 煙花 Canvas */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <h1>⚖️ 天平比重小遊戲</h1>

  <div class="game-container">
    <!-- 選擇物品區域 -->
    <div class="item-section">
      <h3>1. 點擊按鈕把物品放入左右盤（點擊天平上的物品可移除）：</h3>
      <div class="item-grid" id="itemGrid"></div>
    </div>

    <!-- 左右盤狀態顯示與清空 -->
    <div class="pans-control">
      <div class="pan-card left">
        <div class="pan-title">👈 左盤物品 (<span id="leftCount">0</span>)</div>
        <button class="btn-clear" onclick="clearPan('left')">清空左盤</button>
      </div>
      <div class="pan-card right">
        <div class="pan-title">👉 右盤物品 (<span id="rightCount">0</span>)</div>
        <button class="btn-clear" onclick="clearPan('right')">清空右盤</button>
      </div>
    </div>

    <!-- 天平視覺展示 -->
    <div class="scale-stage">
      <div class="scale-beam-container" id="beamContainer">
        <div class="beam"></div>
        <!-- 左盤 -->
        <div class="pan-assembly left" id="leftPanAssembly">
          <div class="strings-v">
            <div class="string"></div>
            <div class="string"></div>
          </div>
          <div class="pan" id="leftPanDisplay"></div>
        </div>
        <!-- 右盤 -->
        <div class="pan-assembly right" id="rightPanAssembly">
          <div class="strings-v">
            <div class="string"></div>
            <div class="string"></div>
          </div>
          <div class="pan" id="rightPanDisplay"></div>
        </div>
      </div>
      <div class="fulcrum"></div>
      <div class="base-line"></div>
    </div>

    <!-- 學生回答問題區域 -->
    <div class="question-section">
      <h3 style="margin-top:0;">2. 觀察天平並回答問題：</h3>
      
      <div class="q-grid">
        <!-- 左邊觀察題組 -->
        <div class="q-group left-group">
          <div class="q-group-title">👈 【左邊】觀察</div>
          <div class="q-block">
            <div class="q-title">Q1. 左邊會？</div>
            <div class="options" id="qLeftStateOptions">
              <div class="option-btn" onclick="selectOption('qLeftState', 'up', this)">向上升</div>
              <div class="option-btn" onclick="selectOption('qLeftState', 'down', this)">向下墜</div>
              <div class="option-btn" onclick="selectOption('qLeftState', 'equal', this)">一樣高</div>
            </div>
          </div>
          <div class="q-block">
            <div class="q-title">Q2. 左邊比較？</div>
            <div class="options" id="qLeftWeightOptions">
              <div class="option-btn" onclick="selectOption('qLeftWeight', 'heavy', this)">較重</div>
              <div class="option-btn" onclick="selectOption('qLeftWeight', 'light', this)">較輕</div>
              <div class="option-btn" onclick="selectOption('qLeftWeight', 'equal', this)">一樣重</div>
            </div>
          </div>
        </div>

        <!-- 右邊觀察題組 -->
        <div class="q-group right-group">
          <div class="q-group-title">👉 【右邊】觀察</div>
          <div class="q-block">
            <div class="q-title">Q3. 右邊會？</div>
            <div class="options" id="qRightStateOptions">
              <div class="option-btn" onclick="selectOption('qRightState', 'up', this)">向上升</div>
              <div class="option-btn" onclick="selectOption('qRightState', 'down', this)">向下墜</div>
              <div class="option-btn" onclick="selectOption('qRightState', 'equal', this)">一樣高</div>
            </div>
          </div>
          <div class="q-block">
            <div class="q-title">Q4. 右邊比較？</div>
            <div class="options" id="qRightWeightOptions">
              <div class="option-btn" onclick="selectOption('qRightWeight', 'heavy', this)">較重</div>
              <div class="option-btn" onclick="selectOption('qRightWeight', 'light', this)">較輕</div>
              <div class="option-btn" onclick="selectOption('qRightWeight', 'equal', this)">一樣重</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 按鈕與結果 -->
    <div class="action-bar">
      <button class="btn-main btn-check" id="btnCheck" onclick="checkAnswer()">驗證答案</button>
      <button class="btn-main btn-reset" onclick="resetAll()">重新開始</button>
    </div>

    <div class="feedback" id="feedbackMsg"></div>
  </div>

  <canvas id="fireworksCanvas"></canvas>

  <script>
    // 可選物件資料庫
    const ITEMS = [
      { id: 'marble', name: '波子', icon: '🔮', weight: 10 },
      { id: 'banana', name: '香蕉', icon: '🍌', weight: 30 },
      { id: 'apple',  name: '蘋果', icon: '🍎', weight: 50 },
      { id: 'bear',   name: '公仔', icon: '🧸', weight: 60 },
      { id: 'car',    name: '玩具車', icon: '🚗', weight: 90 },
      { id: 'watermelon', name: '西瓜', icon: '🍉', weight: 150 }
    ];

    let leftPan = [];
    let rightPan = [];
    let autoResetTimer = null;
    
    // 儲存學生的選擇
    let answers = {
      qLeftState: null,
      qLeftWeight: null,
      qRightState: null,
      qRightWeight: null
    };

    // 音效發聲器 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        const now = audioCtx.currentTime;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);     // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else if (type === 'wrong') {
        const now = audioCtx.currentTime;
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now); // A3
        osc.frequency.setValueAtTime(180, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    // 初始化渲染物品選單
    function initItemGrid() {
      const grid = document.getElementById('itemGrid');
      grid.innerHTML = '';
      ITEMS.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-icon">${item.icon}</div>
          <div class="item-name">${item.name}</div>
          <div class="btn-group">
            <button class="btn-add btn-left" onclick="addItem('${item.id}', 'left')">+ 左</button>
            <button class="btn-add btn-right" onclick="addItem('${item.id}', 'right')">+ 右</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addItem(itemId, side) {
      const item = ITEMS.find(i => i.id === itemId);
      if (!item) return;
      if (side === 'left') leftPan.push(item);
      else rightPan.push(item);
      updateDisplay();
    }

    function removeItem(side, index) {
      if (side === 'left') leftPan.splice(index, 1);
      else rightPan.splice(index, 1);
      updateDisplay();
    }

    function clearPan(side) {
      if (side === 'left') leftPan = [];
      else rightPan = [];
      updateDisplay();
    }

    // 即時更新顯示與天平傾斜
    function updateDisplay() {
      const leftDisplay = document.getElementById('leftPanDisplay');
      const rightDisplay = document.getElementById('rightPanDisplay');

      leftDisplay.innerHTML = leftPan.map((item, index) => 
        `<span class="pan-item" title="點擊移除" onclick="removeItem('left', ${index})">${item.icon}</span>`
      ).join('');

      rightDisplay.innerHTML = rightPan.map((item, index) => 
        `<span class="pan-item" title="點擊移除" onclick="removeItem('right', ${index})">${item.icon}</span>`
      ).join('');

      document.getElementById('leftCount').innerText = leftPan.length;
      document.getElementById('rightCount').innerText = rightPan.length;

      // 即時動態天平傾斜
      const totalLeft = leftPan.reduce((sum, item) => sum + item.weight, 0);
      const totalRight = rightPan.reduce((sum, item) => sum + item.weight, 0);
      const diff = totalRight - totalLeft;

      let angle = 0;
      if (diff !== 0) {
        angle = Math.sign(diff) * Math.min(Math.abs(diff) * 0.15 + 4, 18);
      }

      document.getElementById('beamContainer').style.transform = `rotate(${angle}deg)`;
      document.getElementById('leftPanAssembly').style.transform = `rotate(${-angle}deg)`;
      document.getElementById('rightPanAssembly').style.transform = `rotate(${-angle}deg)`;
    }

    function selectOption(key, val, el) {
      answers[key] = val;
      const parent = el.parentElement;
      parent.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
      el.classList.add('selected');
    }

    // 檢查答案
    function checkAnswer() {
      const feedback = document.getElementById('feedbackMsg');

      if (leftPan.length === 0 && rightPan.length === 0) {
        feedback.className = 'feedback wrong';
        feedback.innerText = '請先在天平放入物品！';
        return;
      }

      if (!answers.qLeftState || !answers.qLeftWeight || !answers.qRightState || !answers.qRightWeight) {
        feedback.className = 'feedback wrong';
        feedback.innerText = '請回答完所有（共 4 條）問題再驗證答案喔！';
        return;
      }

      const totalLeft = leftPan.reduce((sum, item) => sum + item.weight, 0);
      const totalRight = rightPan.reduce((sum, item) => sum + item.weight, 0);

      let targetLeftState, targetLeftWeight, targetRightState, targetRightWeight;

      if (totalLeft > totalRight) {
        targetLeftState = 'down';   // 左邊向下墜
        targetLeftWeight = 'heavy'; // 左邊較重
        targetRightState = 'up';    // 右邊向上升
        targetRightWeight = 'light';// 右邊較輕
      } else if (totalLeft < totalRight) {
        targetLeftState = 'up';     // 左邊向上升
        targetLeftWeight = 'light'; // 左邊較輕
        targetRightState = 'down';  // 右邊向下墜
        targetRightWeight = 'heavy';// 右邊較重
      } else {
        targetLeftState = 'equal';
        targetLeftWeight = 'equal';
        targetRightState = 'equal';
        targetRightWeight = 'equal';
      }

      const isCorrect = (
        answers.qLeftState === targetLeftState &&
        answers.qLeftWeight === targetLeftWeight &&
        answers.qRightState === targetRightState &&
        answers.qRightWeight === targetRightWeight
      );

      if (isCorrect) {
        feedback.className = 'feedback correct';
        feedback.innerText = '🎉 全部答對了！非常棒！(3秒後自動重置)';
        playSound('correct');
        launchFireworks();

        // 鎖定按鈕避免重複點擊
        document.getElementById('btnCheck').disabled = true;

        // 3 秒後自動 Reset
        if (autoResetTimer) clearTimeout(autoResetTimer);
        autoResetTimer = setTimeout(() => {
          resetAll();
        }, 3000);
      } else {
        feedback.className = 'feedback wrong';
        feedback.innerText = '❌ 答錯了，仔細觀察左右兩邊天平的狀態再試試吧！';
        playSound('wrong');
      }
    }

    function resetAll() {
      if (autoResetTimer) clearTimeout(autoResetTimer);
      leftPan = [];
      rightPan = [];
      answers = {
        qLeftState: null,
        qLeftWeight: null,
        qRightState: null,
        qRightWeight: null
      };
      document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('feedbackMsg').innerText = '';
      document.getElementById('btnCheck').disabled = false;
      updateDisplay();
    }

    // 煙花效果 (Canvas Fireworks)
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchFireworks() {
      particles = [];
      const colors = ['#ff1744', '#f50057', '#d500f9', '#651fff', '#3d5aff', '#00e5ff', '#1de9b6', '#00e676', '#ffea00', '#ff9100'];
      
      for (let f = 0; f < 5; f++) {
        const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
        const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
        
        for (let i = 0; i < 50; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 6 + 2;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1,
            decay: Math.random() * 0.02 + 0.015
          });
        }
      }
      requestAnimationFrame(renderFireworks);
    }

    function renderFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(index, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
          ctx.restore();
        }
      });

      if (particles.length > 0) {
        requestAnimationFrame(renderFireworks);
      }
    }

    initItemGrid();
  </script>
</body>
</html>
